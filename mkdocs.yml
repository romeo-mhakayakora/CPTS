site_name: CPTS Notes
site_description: Certified Penetration Testing Specialist — study dashboard, modules and technical notes.
site_author: Romeo Mhakayakora
site_url: https://romeo-mhakayakora.github.io/CPTS/
repo_url: https://github.com/romeo-mhakayakora/CPTS
repo_name: GitHub

# Single source of truth: notes live as README.md files in the repo root
# (so GitHub renders them). `build-site.sh` copies them into docs/
# before every build — docs/ is generated, never committed.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid.js

