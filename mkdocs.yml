      - Information Gathering – Web Edition: 01-information-gathering/information-gathering-web-edition/README.md
      - Vulnerability Assessment: 01-information-gathering/vulnerability-assessment/README.md
  - 02 Web & App Security:
      - Overview: 02-web-application-security/README.md
      - Using Web Proxies: 02-web-application-security/using-web-proxies/README.md
      - Attacking Web Apps with Ffuf: 02-web-application-security/attacking-web-applications-with-ffuf/README.md
      - Login Brute Forcing: 02-web-application-security/login-brute-forcing/README.md
      - SQL Injection Fundamentals: 02-web-application-security/sql-injection-fundamentals/README.md
      - SQLMap Essentials: 02-web-application-security/sqlmap-essentials/README.md
      - Cross-Site Scripting: 02-web-application-security/cross-site-scripting/README.md
      - File Inclusion: 02-web-application-security/file-inclusion/README.md
      - File Upload Attacks: 02-web-application-security/file-upload-attacks/README.md
